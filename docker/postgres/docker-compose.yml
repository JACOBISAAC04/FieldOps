services:
  postgres:
    image: postgres:18.6
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - fieldops-postgres-data:/var/lib/postgresql

volumes:
  fieldops-postgres-data: