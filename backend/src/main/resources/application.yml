spring:
  application:
    name: fieldops-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fieldops}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: INFO

analytics:
  service:
    url: ${ANALYTICS_SERVICE_URL:http://localhost:8081}

fieldops:
  storage:
    document-directory: ${DOCUMENT_STORAGE_PATH:D:/FieldOps/storage/documents}