spring:
  application:
    name: fieldops-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fieldops
    username: postgres
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: INFO
analytics:
  service:
    url: http://localhost:8081
fieldops:
  storage:
    document-directory: ${DOCUMENT_STORAGE_PATH:D:/FieldOps/storage/documents}