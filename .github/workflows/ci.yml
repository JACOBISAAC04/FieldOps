name: FieldOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: fieldops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fieldops_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fieldops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: fieldops_ci_password
      FIELDOPS_JWT_SECRET: fieldops-ci-secret-key-12345678901234567890
      ANALYTICS_SERVICE_URL: http://localhost:8081
      DOCUMENT_STORAGE_PATH: /tmp/fieldops-documents

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Start Go Analytics service
        working-directory: analytics
        run: |
          go run . > /tmp/analytics.log 2>&1 &
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/analytics/equipment/risk | grep -q "405"; then
              break
            fi
            sleep 1
          done

      - name: Create document storage directory
        run: mkdir -p /tmp/fieldops-documents

      - name: Run backend tests
        working-directory: backend
        run: mvn clean test

  analytics:
    name: Go Analytics Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run Go tests
        working-directory: analytics
        run: go test ./...

      - name: Build Go service
        working-directory: analytics
        run: go build -o fieldops-analytics .

  frontend:
    name: Angular Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/fieldops-frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend/fieldops-frontend
        run: npm ci

      - name: Run Angular tests
        working-directory: frontend/fieldops-frontend
        run: npm test -- --watch=false

      - name: Build Angular application
        working-directory: frontend/fieldops-frontend
        run: npm run build

  docker:
    name: Docker Builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - analytics
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t fieldops-backend:ci ./backend

      - name: Build analytics image
        run: docker build -t fieldops-analytics:ci ./analytics

      - name: Build frontend image
        run: docker build -t fieldops-frontend:ci ./frontend/fieldops-frontend