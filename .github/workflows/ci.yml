name: FieldOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn clean test

  analytics:
    name: Go Analytics Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run Go tests
        working-directory: analytics
        run: go test ./...

      - name: Build Go service
        working-directory: analytics
        run: go build -o fieldops-analytics .

  frontend:
    name: Angular Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/fieldops-frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend/fieldops-frontend
        run: npm ci

      - name: Run Angular tests
        working-directory: frontend/fieldops-frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular application
        working-directory: frontend/fieldops-frontend
        run: npm run build

  docker:
    name: Docker Builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - analytics
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t fieldops-backend:ci ./backend

      - name: Build analytics image
        run: docker build -t fieldops-analytics:ci ./analytics

      - name: Build frontend image
        run: docker build -t fieldops-frontend:ci ./frontend/fieldops-frontend