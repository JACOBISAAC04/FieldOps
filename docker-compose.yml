services:
  postgres:
    image: postgres:18.6
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - fieldops-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fieldops"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics:
    build:
      context: ./analytics
    image: fieldops-analytics:latest
    container_name: fieldops-analytics
    restart: unless-stopped
    ports:
      - "8081:8081"

  backend:
    build:
      context: ./backend
    image: fieldops-backend:latest
    container_name: fieldops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fieldops
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FIELDOPS_JWT_SECRET: ${FIELDOPS_JWT_SECRET}
      ANALYTICS_SERVICE_URL: http://analytics:8081
      DOCUMENT_STORAGE_PATH: /app/storage/documents
    ports:
      - "8080:8080"
    volumes:
      - fieldops-document-storage:/app/storage/documents

  frontend:
    build:
      context: ./frontend/fieldops-frontend
    image: fieldops-frontend:latest
    container_name: fieldops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"

volumes:
  fieldops-postgres-data:
    external: true
    name: postgres_fieldops-postgres-data
  fieldops-document-storage: